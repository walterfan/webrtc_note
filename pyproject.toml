authors = [{ name = "Walter Fan" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "sphinx>=7.0,<9.0",
    "sphinx-rtd-theme>=2.0,<4.0",
    "sphinxcontrib-plantuml>=0.30,<1.0",
